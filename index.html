  <section class="contact-band" aria-labelledby="contact-heading">
    <h2 id="contact-heading">Have Questions? Let's Talk</h2>
    <p class="lead">Send us a quick note and we'll get back within one business day.</p>

    <!-- Posts to Web3Forms, which emails each submission to the address
         registered against the access key below. The form works without
         JavaScript (it POSTs and lands on thanks.html); js/script.js
         upgrades it to submit in place. -->
    <form class="form" action="https://api.web3forms.com/submit" method="POST"
          data-fallback-email="zendacom.inc@outlook.com">

      <!-- Web3Forms access key. Public by design - it only authorises
           delivery to the recipient set in the Web3Forms dashboard. -->
      <input type="hidden" name="access_key" value="3dbab5c6-f8b8-4187-b4db-a3c7d3c2ae18">

      <input type="hidden" name="subject" value="New enquiry from zendacom.com">
      <input type="hidden" name="from_name" value="Zendacom website">
      <input type="hidden" name="redirect" value="https://zendacom.com/thanks.html">

      <!-- Honeypot: bots fill it, people never see it. -->
      <input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <fieldset>
        <legend>Name</legend>
        <div class="field-row">
          <div class="field">
            <label for="home-first">First Name <span class="req">(required)</span></label>
            <input type="text" id="home-first" name="firstName" autocomplete="given-name" required>
          </div>
          <div class="field">
            <label for="home-last">Last Name <span class="req">(required)</span></label>
            <input type="text" id="home-last" name="lastName" autocomplete="family-name" required>
          </div>
        </div>
      </fieldset>

      <div class="field">
        <label for="home-email">Email <span class="req">(required)</span></label>
        <input type="email" id="home-email" name="email" autocomplete="email" required>
      </div>

      <div class="field">
        <label for="home-message">Message <span class="req">(required)</span></label>
        <textarea id="home-message" name="message" rows="6" required></textarea>
      </div>

      <div class="form-actions">
        <button class="btn btn--light" type="submit">Send</button>
        <p class="form-note" role="status" aria-live="polite"></p>
      </div>
    </form>
  </section>
